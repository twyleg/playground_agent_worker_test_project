[tox]
requires =
    tox>=4
env_list = type, lint, cli, pytest

[testenv:pytest]
description = run unit tests
deps =
    -r{toxinidir}/requirements.txt
commands =
    pytest

[testenv:docs]
changedir = docs/src
deps =
    -r{toxinidir}/requirements.txt
setenv =
    PYTHONPATH = {toxinidir}
commands =
    sphinx-build -W -b html -d {envtmpdir}/doctrees . {envtmpdir}/html

[testenv:lint_update]
description = run linters
deps =
    -r{toxinidir}/requirements.txt
commands =
    black --extend-exclude "(external/|versioneer[.]py|_version[.]py)" -l 160 {posargs:.}

[testenv:lint]
description = run linters
deps =
    -r{toxinidir}/requirements.txt
commands =
    black --extend-exclude "(external/|versioneer[.]py|_version[.]py)" --check -l 160 {posargs:.}

[testenv:type]
description = run type checks
deps =
    -r{toxinidir}/requirements.txt
commands =
    mypy {posargs:playground_agent_worker_test_project tests examples}

[testenv:cli]
description = run smoke test for cli
deps =
    -r{toxinidir}/requirements.txt
commands =
    python -m build
    playground_agent_worker_test_project --version

[testenv:pyinstaller]
description = build executable with pyinstaller
deps =
    -r{toxinidir}/requirements.txt
commands =
    pyinstaller --noconfirm pyinstaller.spec
    python -c "import os, subprocess; subprocess.run(['dist/main.exe' if os.name == 'nt' else './dist/main', '--version'], check=True)"
